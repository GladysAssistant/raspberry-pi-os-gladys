name: Build Gladys Raspberry Pi image

on:
  push:
    branches: [main]
  schedule:
    # First day of each month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner: pi-gen arm64 branch requires aarch64 (QEMU on x86 is unreliable on GHA).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pi-gen-action's increase-runner-disk-size fails when optional packages
      # (e.g. google-cloud-cli-anthoscli) are not installed on the runner.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Build image with pi-gen
        id: pigen
        uses: usimd/pi-gen-action@v1
        with:
          image-name: gladys-assistant
          pi-gen-repository: RPi-Distro/pi-gen
          pi-gen-version: arm64
          release: trixie
          stage-list: stage0 stage1 stage2 ./stage2-gladys
          hostname: gladys
          timezone: Etc/UTC
          locale: en_GB.UTF-8
          username: pi
          password: raspberry
          disable-first-boot-user-rename: "1"
          enable-ssh: "1"
          enable-cloud-init: "1"
          compression: zip
          compression-level: "6"
          export-last-stage-only: true
          increase-runner-disk-size: false
          pi-gen-release: Gladys Assistant
          verbose-output: true

      - name: Generate checksums and Raspberry Pi Imager manifest
        id: manifest
        env:
          RELEASE_TAG: image-${{ github.run_number }}
        run: |
          set -euo pipefail

          IMAGE="${{ steps.pigen.outputs.image-path }}"
          ZIP_BASENAME="$(basename "$IMAGE")"
          MANIFEST_PATH="${GITHUB_WORKSPACE}/raspberry-pi-imager.json"
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_BASENAME}"

          sha256sum "$IMAGE" | tee "${IMAGE}.sha256"

          IMAGE_DOWNLOAD_SHA256="$(sha256sum "$IMAGE" | awk '{print $1}')"
          IMAGE_DOWNLOAD_SIZE="$(stat -c%s "$IMAGE")"

          WORKDIR="$(mktemp -d)"
          unzip -q "$IMAGE" -d "$WORKDIR"
          IMG_FILE="$(find "$WORKDIR" -name '*.img' -type f | head -1)"
          if [ -z "$IMG_FILE" ]; then
            echo "No .img file found inside $IMAGE"
            exit 1
          fi

          EXTRACT_SHA256="$(sha256sum "$IMG_FILE" | awk '{print $1}')"
          EXTRACT_SIZE="$(stat -c%s "$IMG_FILE")"
          rm -rf "$WORKDIR"

          jq \
            --arg url "$DOWNLOAD_URL" \
            --argjson extract_size "$EXTRACT_SIZE" \
            --arg extract_sha256 "$EXTRACT_SHA256" \
            --argjson image_download_size "$IMAGE_DOWNLOAD_SIZE" \
            --arg image_download_sha256 "$IMAGE_DOWNLOAD_SHA256" \
            --arg release_date "$RELEASE_DATE" \
            '
            .os_list[0] += {
              url: $url,
              extract_size: $extract_size,
              extract_sha256: $extract_sha256,
              image_download_size: $image_download_size,
              image_download_sha256: $image_download_sha256,
              release_date: $release_date
            }
            ' \
            .github/raspberry-pi-imager.template.json > "$MANIFEST_PATH"

          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo "Raspberry Pi Imager manifest:"
          cat "$MANIFEST_PATH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gladys-assistant-raspios-lite-arm64
          path: |
            ${{ steps.pigen.outputs.image-path }}
            ${{ steps.pigen.outputs.image-path }}.sha256
            ${{ steps.manifest.outputs.manifest_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image-${{ github.run_number }}
          name: Gladys Assistant Raspberry Pi OS (build ${{ github.run_number }})
          body: |
            Raspberry Pi OS Lite 64-bit (Trixie) with Gladys Assistant pre-configured.

            - Hostname: `gladys`
            - User: `pi` / password: `raspberry`
            - SSH: enabled
            - A setup page is shown on first boot while Gladys downloads (`gladys-setup-in-progress`)
            - Gladys and Watchtower start on first boot (latest `v4` images pulled from Docker Hub)

            Flash with [Raspberry Pi Imager](https://www.raspberrypi.com/software/) or `dd`, then open `http://<pi-ip>/` to follow setup progress.

            ### Raspberry Pi Imager

            Download `raspberry-pi-imager.json` from this release for the [custom image manifest](https://www.raspberrypi.com/documentation/computers/os.html#rpi-imager-customisation) (`url` points to this release's `.zip` asset).

            If you mirror the image to another URL (e.g. `gladysassistant.com`), update the `url` field before publishing your manifest.
          files: |
            ${{ steps.pigen.outputs.image-path }}
            ${{ steps.pigen.outputs.image-path }}.sha256
            ${{ steps.manifest.outputs.manifest_path }}
          generate_release_notes: false
          make_latest: true
